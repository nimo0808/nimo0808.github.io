name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：读取代码、发布 Pages、OIDC 部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 仓库 Settings → Secrets and variables → Actions → Variables 中配置（非密钥）
      PUBLIC_AI_ENDPOINT: ${{ vars.PUBLIC_AI_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
